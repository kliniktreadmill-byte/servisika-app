            let cleanPhone = (phone || '').replace(/[\D\s-]/g, '');

            if (navigator.clipboard && window.isSecureContext) {

            } else {
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                alert(customAlert);
            }
        };

            const handleAdminLogin = (e) => {

            const kasBerjalan = useMemo(() => {
                return transactions

                    return matchSearch && matchType && matchStart && matchEnd;

                        {isStandalone && (

            };

            const generateInvoiceLink = (orderId) => {
                const appUrl = window.location.origin + window.location.pathname;

            };

            // FUNGSI INPUT MASSAL (BULK UPLOAD via Text / OCR)
            const handleOCR = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsProcessingOCR(true);
                try {
                    const worker = await window.Tesseract.createWorker('ind');
                    const ret = await worker.recognize(file);
                    setBulkText(prev => prev + (prev ? '\n\n' : '') + ret.data.text);
                    await worker.terminate();
                } catch (err) {
                    console.error(err);
                    alert("Gagal mengekstrak teks dari gambar. Gunakan fitur copy-paste manual.");
                } finally {
                    setIsProcessingOCR(false);
                    e.target.value = null; // reset input file
                }
            };

            const parseTextToOrders = () => {
                // Memisahkan setiap order berdasarkan dua baris kosong atau garis pembatas
                const blocks = bulkText.split(/\n\s*\n|---/);
                const newOrders = [];

                const extractValue = (lines, keywords) => {
                    for (let line of lines) {
                        const lowerLine = line.toLowerCase();
                        for (let kw of keywords) {
                            const regex = new RegExp(`^\\s*${kw}\\s*[:\\-]\\s*(.+)`, 'i');
                            const match = lowerLine.match(regex);
                            if (match) return match[1].trim();
                            // Alternatif jika format tanpa spasi "Nama:Budi"
                            if (lowerLine.startsWith(kw)) {
                                const idx = lowerLine.indexOf(':') > -1 ? lowerLine.indexOf(':') : lowerLine.indexOf('-');
                                if (idx > -1) {
                                    const val = line.substring(idx + 1).trim();
                                    if(val) return val;
                                }
                            }
                        }
                    }
                    return '';
                };

                blocks.forEach(block => {
                    if (!block.trim()) return;

                    // Jika minimal ada nama pelanggan ATAU unit, kita anggap itu order valid

                const mondayDate = new Date(todayDateObj);
                mondayDate.setDate(diffToMonday);
                mondayDate.setHours(0,0,0,0);
                
                const sundayDate = new Date(mondayDate);
                sundayDate.setDate(mondayDate.getDate() + 6);
                sundayDate.setHours(23,59,59,999);
                
                const nextMonday = new Date(mondayDate);
                nextMonday.setDate(mondayDate.getDate() + 7);

                if (financeFilter.startDate) displayOrders = displayOrders.filter(o => o.date >= financeFilter.startDate);
                if (financeFilter.endDate) displayOrders = displayOrders.filter(o => o.date <= financeFilter.endDate);

                const activeFiltered = displayOrders.filter(o => isOrderActive(o.status) || o.status.includes('Komplain'));
                
                let filteredForTime = activeFiltered;
                if (dashTimeFilter === 'hari_ini') {
                    filteredForTime = activeFiltered.filter(o => o.date === todayStr);
                } else if (dashTimeFilter === 'minggu_ini') {

                        return d >= nextMonday && d <= nextSunday;
                    });
                } else if (dashTimeFilter === 'bulan_ini') {
                    filteredForTime = activeFiltered.filter(o => {
                        const d = new Date(o.date);
                        return d >= firstDayOfMonth && d <= lastDayOfMonth;
                    });
                }

                const upcomingList = filteredForTime.filter(o => o.date >= todayStr).sort((a,b) => new Date(a.date) - new Date(b.date));
                const overdueList = filteredForTime.filter(o => o.date < todayStr).sort((a,b) => new Date(b.date) - new Date(a.date));

                                    <p className="text-[10px] text-red-600 font-black uppercase tracking-widest mt-1 bg-red-50 px-2 rounded-full w-full truncate border border-red-100">{new Date(o.date).toLocaleDateString('id-ID', {month:'short'})}</p>

                const mondayDate = new Date(todayDateObj);
                mondayDate.setDate(diffToMonday);
                mondayDate.setHours(0,0,0,0);
                
                const sundayDate = new Date(mondayDate);
                sundayDate.setDate(mondayDate.getDate() + 6);
                sundayDate.setHours(23,59,59,999);

                nextMonday.setDate(mondayDate.getDate() + 7);
                const nextSunday = new Date(sundayDate);

                                        </select>
                                    </div>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Estimasi Waktu Datang</label><input type="text" name="time_estimate" placeholder="Cth: 08:00 - 10:00" className="w-full border-2 border-slate-200 p-3 rounded-xl font-bold outline-none focus:border-red-500 text-slate-800" /></div>
                                    
                                    <div className="pt-2 border-t border-slate-100">
                                        <label className="text-[10px] font-black text-purple-600 uppercase tracking-widest ml-1 mb-1 block"><i className="fa-solid fa-handshake"></i> Asal Vendor (Opsional)</label>
                                        <select name="vendor_name" className="w-full border-2 border-purple-200 p-3.5 rounded-xl font-bold outline-none focus:border-purple-500 cursor-pointer bg-purple-50 text-purple-800 mb-4">
                                            <option value="">-- Bukan dari Vendor (Reguler) --</option>
                                            {vendors.map(v => <option key={v.id} value={v.name}>{v.name}</option>)}
                                        </select>

                                        <button type="submit" disabled={isSaving} className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-red-600/30 transition-transform active:scale-95 disabled:opacity-50">
                                            {isSaving ? 'Menyimpan...' : 'Simpan & Buat Order'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal Tambah / Edit Vendor Baru */}
                    {showVendorModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm fade-in">
                            <div className="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden border border-slate-200">
                                <div className="bg-purple-50 border-b border-purple-100 p-5 flex justify-between items-center">
                                    <h3 className="font-black text-xl text-purple-800 flex items-center gap-2"><i className="fa-solid fa-handshake"></i> {vendorFormMode === 'add' ? 'Tambah Mitra Baru' : 'Edit Data Vendor'}</h3>
                                    <button onClick={() => setShowVendorModal(false)} className="text-purple-400 hover:text-purple-800 bg-white p-2 w-8 h-8 flex items-center justify-center rounded-full border border-purple-200 shadow-sm"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <form onSubmit={handleSaveVendor} className="p-6 space-y-4">
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Nama Vendor / Perusahaan</label>
                                        <input type="text" name="name" defaultValue={vendorFormMode === 'edit' ? selectedVendor.name : ''} required placeholder="Cth: Fitbox" className="w-full border-2 border-slate-200 p-3 rounded-xl font-bold outline-none focus:border-purple-500 text-slate-700 bg-slate-50" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Nama PIC (Penanggung Jawab)</label>
                                        <input type="text" name="pic_name" defaultValue={vendorFormMode === 'edit' ? selectedVendor.pic_name : ''} placeholder="Cth: Pak Budi" className="w-full border-2 border-slate-200 p-3 rounded-xl font-bold outline-none focus:border-purple-500 text-slate-700 bg-slate-50" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Nomor Kontak (Opsional)</label>
                                        <input type="text" name="phone" defaultValue={vendorFormMode === 'edit' ? selectedVendor.phone : ''} placeholder="Cth: 08123..." className="w-full border-2 border-slate-200 p-3 rounded-xl font-bold outline-none focus:border-purple-500 text-slate-700 bg-slate-50" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Pilih Brand Tagihan</label>
                                        <select name="brand" defaultValue={vendorFormMode === 'edit' ? selectedVendor.brand : 'Servisika'} className="w-full border-2 border-slate-200 p-3 rounded-xl font-bold outline-none focus:border-purple-500 bg-slate-50 cursor-pointer text-slate-700">
                                            <option value="Servisika">Servisika (Default)</option>
                                            <option value="Harmoni Fitness">Harmoni Fitness</option>
                                        </select>
                                    </div>
                                    <div className="pt-4 border-t border-slate-100">
                                        <button type="submit" disabled={isSaving} className="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-purple-600/30 transition-transform active:scale-95 disabled:opacity-50">
                                            {isSaving ? 'Menyimpan...' : 'Simpan Vendor'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal Tambah Transaksi Kas */}
                    {showFinanceModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm fade-in">
                            <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden border border-slate-200">
                                <div className="bg-emerald-50 border-b border-emerald-100 p-5 flex justify-between items-center">
                                    <h3 className="font-black text-xl text-emerald-800 flex items-center gap-2"><i className="fa-solid fa-file-invoice-dollar"></i> Catat Transaksi</h3>
                                    <button onClick={() => { setShowFinanceModal(false); setTrxTypeForm('in'); }} className="text-emerald-600 hover:bg-emerald-100 bg-white p-2 w-8 h-8 flex items-center justify-center rounded-full border border-emerald-200 shadow-sm"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <form onSubmit={handleAddTransaction} className="p-6 space-y-4">
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Tgl Transaksi</label><input type="date" name="date" required defaultValue={new Date().toISOString().split('T')[0]} className="w-full border-2 border-slate-200 p-3 rounded-xl font-bold outline-none focus:border-emerald-500 text-slate-700 bg-slate-50" /></div>
                                    
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Jenis Transaksi</label>
                                        <select name="type" value={trxTypeForm} onChange={(e) => setTrxTypeForm(e.target.value)} className="w-full border-2 border-slate-200 p-3 rounded-xl font-bold outline-none focus:border-emerald-500 bg-slate-50 cursor-pointer text-slate-700">
                                            <option value="in">Pemasukan (+)</option>
                                            <option value="out">Pengeluaran (-)</option>
                                            <option value="transfer">Pindah / Transfer Antar Kas</option>
                                        </select>
                                    </div>
                                    
                                    {trxTypeForm === 'transfer' ? (
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Dari Kas</label>
                                                <select name="from_category" className="w-full border-2 border-slate-200 p-3 rounded-xl font-bold outline-none focus:border-emerald-500 bg-slate-50 cursor-pointer text-slate-700">
                                                    <option value="Kas Berjalan">Kas Berjalan</option>
                                                    <option value="Kas Tetap">Kas Tetap</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Ke Kas</label>
                                                <select name="to_category" defaultValue="Kas Tetap" className="w-full border-2 border-slate-200 p-3 rounded-xl font-bold outline-none focus:border-emerald-500 bg-slate-50 cursor-pointer text-slate-700">
                                                    <option value="Kas Berjalan">Kas Berjalan</option>
                                                    <option value="Kas Tetap">Kas Tetap</option>
                                                </select>
                                            </div>
                                        </div>
                                    ) : (
                                        <div>
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Pilih Kas</label>
                                            <select name="category" className="w-full border-2 border-slate-200 p-3 rounded-xl font-bold outline-none focus:border-emerald-500 bg-slate-50 cursor-pointer text-slate-700">
                                                <option value="Kas Berjalan">Kas Berjalan</option>
                                                <option value="Kas Tetap">Kas Tetap</option>
                                            </select>
                                        </div>
                                    )}

                                    <div><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Nominal Rupiah</label>
                                        <div className="relative">
                                            <span className="absolute left-4 top-[17px] text-slate-400 font-black text-lg">Rp</span>
                                            <input type="text" name="amount" required onChange={(e) => e.target.value = formatNumberStr(e.target.value)} placeholder="0" className="w-full border-2 border-slate-200 p-4 pl-12 rounded-xl font-black text-2xl outline-none focus:border-emerald-500 text-slate-800" />
                                        </div>
                                    </div>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Keterangan</label><input type="text" name="desc" required placeholder="Cth: Beli sparepart..." className="w-full border-2 border-slate-200 p-3 rounded-xl font-bold outline-none focus:border-emerald-500 text-slate-800" /></div>
                                    <div className="pt-2 border-t border-slate-100">
                                        <button type="submit" disabled={isSaving} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-600/30 transition-transform active:scale-95 disabled:opacity-50">
                                            {isSaving ? 'Menyimpan...' : 'Simpan Transaksi'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal Detail Kas Khusus */}
                    {showCashDetailModal.isOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm fade-in">
                            <div className="bg-white rounded-2xl w-full max-w-3xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden border border-slate-200">
                                <div className={`p-6 flex justify-between items-center shrink-0 text-white ${showCashDetailModal.type === 'Kas Berjalan' ? 'bg-blue-600' : 'bg-red-600'}`}>
                                    <div><p className="text-[10px] font-black uppercase tracking-widest opacity-80 mb-1">Riwayat Filter</p><h3 className="font-black text-2xl">{showCashDetailModal.type}</h3></div>
                                    <button onClick={() => setShowCashDetailModal({ isOpen: false, type: null })} className="bg-black/20 hover:bg-black/30 w-10 h-10 flex items-center justify-center rounded-full transition-colors"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <div className="overflow-y-auto flex-1 bg-slate-50">
                                    <div className="divide-y divide-slate-200 bg-white">
                                        {transactions
                                            .filter(t => t.category === showCashDetailModal.type && !t.is_hidden)
                                            .filter(t => (!financeFilter.startDate || t.date >= financeFilter.startDate) && (!financeFilter.endDate || t.date <= financeFilter.endDate))
                                            .map(trx => (
                                            <div key={trx.id} className="p-4 sm:p-5 flex justify-between items-center hover:bg-slate-50 transition-colors group">
                                                <div>
                                                    <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1"><i className="fa-regular fa-calendar mr-1"></i> {new Date(trx.date).toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})}</p>
                                                    <p className="font-bold text-slate-800 text-sm">{trx.description}</p>
                                                </div>
                                                <div className="flex items-center gap-4">
                                                    <div className={`font-black text-base sm:text-lg ${trx.type === 'in' ? 'text-green-600' : 'text-red-600'}`}>
                                                        {trx.type === 'in' ? '+' : '-'}{formatRupiah(trx.amount)}
                                                    </div>
                                                    <button onClick={() => handleDeleteTransaction(trx.id)} className="text-slate-400 hover:text-red-600 p-2 bg-slate-50 hover:bg-red-50 border border-transparent hover:border-red-100 rounded-lg transition-all shadow-sm active:scale-95 sm:opacity-0 group-hover:opacity-100"><i className="fa-solid fa-trash"></i></button>
                                                </div>
                                            </div>
                                        ))}
                                        {transactions.filter(t => t.category === showCashDetailModal.type && !t.is_hidden).length === 0 && <div className="py-16 text-center text-slate-400 font-medium"><i className="fa-solid fa-folder-open text-4xl mb-3 opacity-30 block"></i>Belum ada transaksi di kas ini.</div>}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Modal Tambah Teknisi */}
                    {showTechModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm fade-in">
                            <div className="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden border border-slate-200">
                                <div className="bg-slate-50 border-b border-slate-200 p-5 flex justify-between items-center">
                                    <h3 className="font-black text-xl text-slate-800 flex items-center gap-2"><i className="fa-solid fa-user-plus text-red-600"></i> Tambah Teknisi</h3>
                                    <button onClick={() => setShowTechModal(false)} className="text-slate-400 hover:text-slate-800 bg-white p-2 w-8 h-8 flex items-center justify-center rounded-full border border-slate-200 shadow-sm"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <form onSubmit={handleAddTechnician} className="p-6 space-y-4">
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Nama Panggilan / Lengkap</label>
                                        <input type="text" name="name" required placeholder="Cth: Away" className="w-full border-2 border-slate-200 p-3 rounded-xl font-bold outline-none focus:border-red-500 text-slate-700 bg-slate-50" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Nomor WA Aktif</label>
                                        <input type="text" name="phone" required placeholder="Cth: 08123..." className="w-full border-2 border-slate-200 p-3 rounded-xl font-bold outline-none focus:border-red-500 text-slate-700 bg-slate-50" />
                                    </div>
                                    <div className="pt-4 border-t border-slate-100">
                                        <button type="submit" disabled={isSaving} className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-red-600/30 transition-transform active:scale-95 disabled:opacity-50">
                                            {isSaving ? 'Menyimpan...' : 'Simpan & Buat Akses'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </>
            );

            return (
                <div className="h-screen w-full flex overflow-hidden">
                    <Navigation />
                    <div className={`flex-1 flex flex-col h-full overflow-hidden relative bg-slate-50/50 ${isBossView ? '' : 'md:ml-64'}`}>
                        {!isBossView && (
                            <header className="bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 sm:px-6 py-4 flex items-center justify-between z-40 sticky top-0 no-print shadow-sm">
                                <div className="flex items-center gap-4">
                                    <button className="md:hidden text-slate-600 bg-slate-100 hover:bg-slate-200 p-2.5 rounded-xl transition-colors active:scale-95" onClick={() => setIsMobileMenuOpen(true)}><i className="fa-solid fa-bars-staggered text-xl"></i></button>
                                    <div>
                                        <h1 className="text-lg sm:text-xl font-black text-slate-800 leading-none mb-1 tracking-tight">{role === 'admin' ? 'Portal Manajemen' : 'Aplikasi Teknisi'}</h1>
                                        <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">{new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                    </div>
                                </div>
                            </header>
                        )}
                        
                        <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 pb-24 no-print relative">
                            {role === 'admin' && activeTab === 'dashboard' && renderDashboard()}
                            {role === 'admin' && activeTab === 'jadwal' && renderJadwal()}
                            {role === 'admin' && activeTab === 'vendor' && renderVendor()}
                            {role === 'admin' && activeTab === 'keuangan' && renderKeuangan()}
                            {role === 'admin' && activeTab === 'tim' && renderTim()}
                            
                            {role === 'bos' && activeTab === 'dashboard' && renderDashboard()}
                            
                            {role === 'teknisi' && renderTeknisiPortal()}
                        </main>
                    </div>
                    {renderModals()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
